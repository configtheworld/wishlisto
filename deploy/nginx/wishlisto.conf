# nginx reverse proxy example.
# Set TRUST_PROXY=true in .env so rate limiting uses the real client IP.

server {
    listen 80;
    listen [::]:80;
    server_name wishlist.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wishlist.example.com;

    ssl_certificate     /etc/letsencrypt/live/wishlist.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wishlist.example.com/privkey.pem;

    # Uploads are limited by MAX_UPLOAD_MB (default 8 MB); leave a little room
    # for multipart overhead.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
